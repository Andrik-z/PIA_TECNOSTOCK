<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>TecnoStock · Mostrador de apartados</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230b5d4b'/%3E%3Cpath d='M9 10h14M16 10v13' stroke='%23f3c75f' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ===== Tokens: verde de placa electrónica + dorado de contactos ===== */
:root{
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"Cascadia Mono",Consolas,"SF Mono",monospace;
  --bg:#edf0ec;--surface:#fff;--surface2:#f5f7f4;--surface3:#e8ede7;--line:#d6ddd4;--line2:#b4c1b3;
  --ink:#10201b;--ink2:#41534c;--ink3:#667871;
  --brand:#0b5d4b;--brand-h:#084a3b;--brand-ink:#fff;--gold:#b7791f;--gold-w:#f6e8c9;--danger:#b4372f;--danger-w:#f7dcd9;--ok:#1e7b3a;--focus:#1d6fd1;
  --s-BORRADOR:#66766f;--s-RESERVA_TEMPORAL:#b7791f;--s-CONFIRMADO:#2457a6;--s-LIQUIDADO:#0b7a75;--s-ENTREGADO:#1e7b3a;--s-VENCIDO:#b4372f;--s-CANCELADO:#7a7f83;
  --r:8px;--rl:14px;--sombra:0 12px 32px rgba(8,30,24,.18),0 2px 6px rgba(8,30,24,.1);--side:236px;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0b1310;--surface:#111d18;--surface2:#162520;--surface3:#1c2e28;--line:#243830;--line2:#35503f;
  --ink:#e7efe9;--ink2:#a8bbb2;--ink3:#7c9288;--brand:#36c19b;--brand-h:#5fd3b3;--brand-ink:#06231b;
  --gold:#e3a83b;--gold-w:#3a2c10;--danger:#ff7b72;--danger-w:#3f1a18;--ok:#52d17a;--focus:#6aa8ff;
  --s-BORRADOR:#93a69d;--s-RESERVA_TEMPORAL:#e3a83b;--s-CONFIRMADO:#6aa8ff;--s-LIQUIDADO:#3ad1c7;--s-ENTREGADO:#52d17a;--s-VENCIDO:#ff7b72;--s-CANCELADO:#9aa3a8;
  --sombra:0 12px 32px rgba(0,0,0,.55),0 2px 6px rgba(0,0,0,.4)}}

*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--font);font-feature-settings:"tnum" 1}
h1,h2,h3,p,dl,dd{margin:0}h1{font-size:1.4rem;letter-spacing:-.01em}h2{font-size:1.02rem}h3{font-size:.95rem}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}a{color:var(--brand)}
table{border-collapse:collapse;width:100%}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}
.mono{font-family:var(--mono);font-size:.86em}.muted{color:var(--ink3)}.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
@media (prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;transition-duration:.001ms!important}}

/* ===== Estructura ===== */
.app{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;padding:22px 14px;background:var(--brand);color:var(--brand-ink)}
@media (prefers-color-scheme:dark){.side{background:#0f1f19;border-right:1px solid var(--line);color:var(--ink)}}
.marca{display:flex;align-items:center;gap:10px;padding:0 8px;font-weight:750;font-size:1.2rem;letter-spacing:-.02em}
.marca svg{width:28px;height:28px}.marca b{color:#f3c75f}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:var(--r);color:inherit;text-decoration:none;opacity:.82;font-weight:520}
.nav a:hover{opacity:1;background:rgba(255,255,255,.09)}
.nav a[aria-current=page]{opacity:1;background:rgba(255,255,255,.17);font-weight:650;box-shadow:inset 3px 0 #f3c75f}
.nav svg{width:20px;height:20px;flex:none}
.reglas{margin-top:auto;padding:14px;border-radius:var(--r);background:rgba(0,0,0,.2);font-size:.84rem}
.reglas h2{font-size:.84rem;opacity:.85;margin-bottom:8px;font-weight:600}
.reglas dl{display:grid;grid-template-columns:1fr auto;gap:4px 10px}.reglas dt{opacity:.8}.reglas dd{font-weight:650;text-align:right}
.main{min-width:0}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:12px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top h1{margin-right:auto}.top .sub{display:block;font-size:.86rem;color:var(--ink3);font-weight:400}
.vista{padding:24px 28px 64px}

/* ===== Controles ===== */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:7px 14px;min-height:38px;border:1px solid var(--line2);border-radius:var(--r);background:var(--surface);font-weight:600;text-decoration:none;color:var(--ink)}
.btn:hover:not(:disabled){background:var(--surface3)}.btn svg{width:18px;height:18px;flex:none}
.btn.p{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}.btn.p:hover:not(:disabled){background:var(--brand-h)}
.btn.d{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,var(--line))}.btn.d:hover:not(:disabled){background:var(--danger-w)}
.btn.g{border-color:transparent;background:transparent}.btn.sm{min-height:30px;padding:3px 10px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:not-allowed}.btn[aria-busy=true]{opacity:.7;cursor:progress}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}.field>span{font-size:.85rem;font-weight:600;color:var(--ink2)}.field small{color:var(--ink3);font-size:.82rem}
.in{width:100%;min-height:38px;padding:7px 10px;background:var(--surface);border:1px solid var(--line2);border-radius:var(--r)}
.in:focus-visible{outline-offset:0;border-color:var(--focus)}.in[aria-invalid=true]{border-color:var(--danger);background:var(--danger-w)}
.chk{display:flex;align-items:center;gap:8px;font-size:.92rem}.chk input{width:18px;height:18px;accent-color:var(--brand)}
.barra-h{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin-bottom:16px}.barra-h .field{min-width:190px}.grow{flex:1}

/* ===== Superficies ===== */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--rl);padding:18px 20px}.panel+.panel{margin-top:16px}.panel>h2{margin-bottom:12px}.flush{padding:0;overflow:hidden}
.g2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:20px;align-items:start}
.scroll{overflow-x:auto}
.tabla th{text-align:left;padding:10px 14px;font-size:.84rem;font-weight:600;color:var(--ink3);border-bottom:1px solid var(--line);background:var(--surface2);white-space:nowrap}
.tabla td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}.tabla tr:last-child td{border-bottom:0}
.tabla th.num{text-align:right}.tabla tr.clic{cursor:pointer}.tabla tr.clic:hover{background:var(--surface2)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:2px 9px;border-radius:99px;font-size:.82rem;font-weight:650;white-space:nowrap;color:var(--c,var(--ink2));background:color-mix(in srgb,var(--c,var(--ink3)) 13%,transparent);border:1px solid color-mix(in srgb,var(--c,var(--ink3)) 35%,transparent)}
.chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--c,var(--ink3))}
.aviso{display:flex;gap:10px;padding:12px 14px;border-radius:var(--r);background:var(--gold-w);border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);font-size:.92rem}
.aviso.err{background:var(--danger-w);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}.aviso svg{width:20px;height:20px;flex:none;margin-top:1px}
.vacio{padding:26px 16px;text-align:center;color:var(--ink3);font-size:.9rem}.vacio strong{display:block;color:var(--ink2);margin-bottom:3px}
.cargando{padding:40px;text-align:center;color:var(--ink3)}
.cargando::before{content:"";display:block;width:26px;height:26px;margin:0 auto 12px;border:3px solid var(--line);border-top-color:var(--brand);border-radius:50%;animation:giro .8s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}

/* ===== Barras de existencia ===== */
.barra{display:flex;height:8px;border-radius:99px;overflow:hidden;background:var(--surface3);min-width:90px}.barra i{display:block;height:100%}
.b-d{background:var(--brand)}.b-a{background:var(--gold)}.b-v{background:var(--ink3)}.b-p{background:var(--s-CONFIRMADO)}
.ley{display:flex;gap:12px;font-size:.84rem;color:var(--ink2);margin-top:4px;flex-wrap:wrap}.ley b{color:var(--ink)}

/* ===== Mostrador: tablero ===== */
.pulso{display:flex;flex-wrap:wrap;gap:8px 36px;padding:0 2px 18px}.pulso dt{font-size:.84rem;color:var(--ink3)}.pulso dd{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
.tablero{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:14px;overflow-x:auto;padding-bottom:10px;align-items:start}
.col{background:var(--surface3);border-radius:var(--rl);padding:12px;display:grid;gap:10px;align-content:start;min-height:200px;border-top:4px solid var(--c,var(--line2))}
.col__cab{display:flex;align-items:baseline;gap:8px;padding:2px 4px}.col__cab .n{margin-left:auto;font-weight:700;color:var(--c)}
.col__nota{font-size:.82rem;color:var(--ink3);padding:0 4px;margin-top:-6px}
details.cerr{margin-top:18px}details.cerr>summary{cursor:pointer;font-weight:650;padding:8px 2px;color:var(--ink2)}details.cerr .tablero{margin-top:8px}
.etq{position:relative;display:grid;gap:7px;width:100%;text-align:left;padding:11px 14px 11px 34px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--c,var(--line2));border-radius:6px 12px 12px 6px}
.etq::before{content:"";position:absolute;left:11px;top:14px;width:11px;height:11px;border-radius:50%;background:var(--surface3);box-shadow:inset 0 0 0 2px var(--line2)}
.etq:hover{border-color:var(--c)}.etq .f{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.etq .id{font-family:var(--mono);font-size:.84rem;font-weight:600}.etq .q{font-size:.88rem;color:var(--ink2)}
.plazo{font-size:.84rem;font-weight:600;font-variant-numeric:tabular-nums;color:var(--c)}.plazo.urg{color:var(--danger)}

/* ===== Línea de estados ===== */
.linea{display:flex;list-style:none;padding:0;margin:4px 0 0}
.linea li{position:relative;flex:1;display:grid;justify-items:center;gap:6px;text-align:center;font-size:.76rem;color:var(--ink3);min-width:0}
.linea li::before{content:"";position:absolute;top:11px;right:50%;width:100%;height:3px;background:var(--line2)}.linea li:first-child::before{display:none}
.pt{position:relative;z-index:1;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:3px solid var(--line2)}.pt svg{width:13px;height:13px}
.linea .ya{color:var(--ink2)}.linea .ya::before,.linea .ahora::before{background:var(--brand)}.linea .ya .pt{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.linea .ahora{color:var(--ink);font-weight:700}.linea .ahora .pt{border-color:var(--c);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}
.linea .ahora .pt::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--c)}
.linea .mal{color:var(--c);font-weight:700}.linea .mal::before{background:var(--c)}.linea .mal .pt{background:var(--c);border-color:var(--c);color:#fff}

/* ===== Detalle, ticket, tiempo ===== */
.imp{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.imp div{padding:10px 12px;border-radius:var(--r);background:var(--surface2);border:1px solid var(--line)}
.imp dt{font-size:.8rem;color:var(--ink3)}.imp dd{margin-top:2px;font-weight:700;font-size:1.02rem;font-variant-numeric:tabular-nums}
.ticket{padding:16px 18px;background:#fbfbf6;color:#1a1f1c;font:.82rem var(--mono);border-radius:4px;box-shadow:0 1px 0 var(--line2),0 8px 0 -4px #fbfbf6,0 9px 0 -4px var(--line2)}
.ticket h3{font-family:var(--font);text-align:center;margin-bottom:8px;color:#10201b}.ticket hr{border:0;border-top:1px dashed #9aa79f;margin:8px 0}
.ticket .l{display:flex;justify-content:space-between;gap:12px}.ticket .qr{margin-top:10px;padding:8px;border:1px dashed #9aa79f;word-break:break-all;text-align:center}
.tiempo{list-style:none;margin:0;padding:0 0 0 16px;border-left:2px solid var(--line);display:grid;gap:14px}
.tiempo li{position:relative;display:grid;gap:2px}.tiempo li::before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--brand);border:2px solid var(--surface)}
.tiempo span{font-size:.84rem;color:var(--ink3)}.tiempo .dato{font:.8rem var(--mono);color:var(--ink2);word-break:break-word}

/* ===== Nuevo apartado ===== */
.cat{display:grid;gap:8px;max-height:560px;overflow-y:auto;padding-right:4px}
.prod{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);align-items:center}.prod.ag{opacity:.55}
.prod .n{font-weight:600}.prod .m{font-size:.84rem;color:var(--ink3)}
.cant{display:inline-flex;border:1px solid var(--line2);border-radius:var(--r);overflow:hidden}.cant button{width:32px;border:0;background:var(--surface2);font-weight:700}.cant button:hover:not(:disabled){background:var(--surface3)}
.cant input{width:44px;text-align:center;border:0;border-inline:1px solid var(--line2);background:var(--surface)}
.resumen{position:sticky;top:84px;display:grid;gap:12px}.resumen td{padding:5px 0}.resumen .tot td{border-top:1px dashed var(--line2);padding-top:9px;font-weight:700}
.chk-l{list-style:none;margin:0;padding:0;display:grid;gap:6px;font-size:.9rem}.chk-l li{display:flex;gap:8px}.chk-l svg{width:18px;height:18px;flex:none;margin-top:2px}.chk-l .ok{color:var(--ok)}.chk-l .no{color:var(--danger)}

/* ===== Reloj ===== */
.reloj{position:relative}.reloj>.btn[data-sim=true]{border-color:var(--gold);background:var(--gold-w)}
.pop{position:absolute;right:0;top:calc(100% + 8px);z-index:20;width:330px;padding:16px;background:var(--surface);border:1px solid var(--line2);border-radius:var(--rl);box-shadow:var(--sombra);display:grid;gap:12px}.pop[hidden]{display:none}.pop p{font-size:.88rem;color:var(--ink2)}.fila{display:flex;gap:8px;flex-wrap:wrap}

/* ===== Toasts, modal, drawer ===== */
#toasts{position:fixed;right:20px;bottom:20px;z-index:100;display:grid;gap:10px;width:min(420px,calc(100vw - 40px))}
.toast{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:start;padding:12px 14px;background:var(--ink);color:var(--bg);border-radius:var(--r);box-shadow:var(--sombra);animation:ent .18s ease-out}
.toast svg{width:20px;height:20px}.toast.ok svg{color:#6ee0a4}.toast.err{background:#7f1d17;color:#fff}.toast b{display:block;font-size:.92rem}.toast span{font-size:.88rem;word-break:break-word}
.toast button{background:none;border:0;color:inherit;opacity:.7;padding:2px}.toast button svg{width:16px;height:16px}@keyframes ent{from{transform:translateY(8px);opacity:0}}
dialog{border:0;padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--sombra)}dialog::backdrop{background:rgba(6,20,15,.55)}
dialog.modal{width:min(520px,calc(100vw - 32px));border-radius:var(--rl)}
.m-cab{padding:18px 22px 0;display:flex;gap:12px;align-items:start}.m-cab h2{flex:1;font-size:1.15rem}.m-cuerpo{padding:14px 22px;display:grid;gap:14px}
.m-pie{padding:14px 22px 20px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;border-top:1px solid var(--line);background:var(--surface2);border-radius:0 0 var(--rl) var(--rl)}
dialog.drawer{margin:0 0 0 auto;height:100vh;max-height:100vh;width:min(640px,100vw);border-radius:var(--rl) 0 0 var(--rl);overflow-y:auto;animation:des .2s ease-out}
@keyframes des{from{transform:translateX(40px);opacity:.4}}
.d-cab{position:sticky;top:0;z-index:2;display:flex;gap:12px;align-items:center;padding:16px 22px;background:var(--surface);border-bottom:1px solid var(--line)}.d-cab h2{flex:1;font-size:1.12rem}
.d-sec{padding:18px 22px;border-bottom:1px solid var(--line);display:grid;gap:12px}.d-sec>h3{color:var(--ink2)}.acc{display:flex;gap:8px;flex-wrap:wrap}

/* ===== Monedero, pruebas ===== */
.saldo{font-size:2.4rem;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.met{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}.met div{padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.met dt{color:var(--ink3);font-size:.85rem}.met dd{margin-top:2px;font-size:1.6rem;font-weight:700}.met .bien dd{color:var(--ok)}.met .mal dd{color:var(--danger)}

@media (max-width:960px){
  .app{grid-template-columns:1fr}.side{position:static;height:auto;gap:12px;padding:12px 14px}.nav{flex-direction:row;overflow-x:auto}.nav a{padding:8px 12px;white-space:nowrap}
  .nav a[aria-current=page]{box-shadow:inset 0 -3px #f3c75f}.reglas{display:none}.top,.vista{padding-inline:16px}.g2{grid-template-columns:1fr}.resumen{position:static}.imp{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="marca"><svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="7" fill="#f3c75f"/><path d="M9 10h14M16 10v13" stroke="#0b5d4b" stroke-width="3" stroke-linecap="round"/></svg><span>Tecno<b>Stock</b></span></div>
    <nav class="nav" id="nav" aria-label="Secciones"></nav>
    <div class="reglas"><h2>Reglas vigentes</h2><dl id="reglas"></dl></div>
  </aside>
  <div class="main">
    <header class="top">
      <h1 id="titulo"></h1>
      <div class="reloj"><button type="button" class="btn" id="reloj-btn" aria-expanded="false" aria-controls="reloj-pop"></button>
        <div class="pop" id="reloj-pop" hidden></div></div>
    </header>
    <main class="vista" id="vista" tabindex="-1"></main>
  </div>
</div>
<div id="toasts" aria-live="polite"></div>
<script type="module">
/* ============================ utilidades ============================ */
const $ = (id) => document.getElementById(id);
function h(tag, props = {}, ...hijos) {               // DOM sin innerHTML: el texto nunca se interpreta como HTML
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k === 'dataset') Object.assign(el.dataset, v);
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value') el.value = v;
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of hijos.flat(Infinity)) if (c != null && c !== false) el.append(c.nodeType ? c : document.createTextNode(String(c)));
  return el;
}
const MXN = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' });
const money = (v) => MXN.format(Number(v));
const parseUTC = (s) => (s ? new Date(/(Z|[+-]\d\d:?\d\d)$/.test(s) ? s : s + 'Z') : null);
const fecha = (s) => { const d = parseUTC(s); return d ? d.toLocaleString('es-MX', { day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' }) : '—'; };
function restante(ms) {
  if (ms <= 0) return null;
  const s = Math.floor(ms / 1000), m = Math.floor(s / 60), hh = Math.floor(m / 60), d = Math.floor(hh / 24);
  return d >= 1 ? `${d} d ${hh % 24} h` : hh >= 1 ? `${hh} h ${m % 60} min` : `${String(m).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
}
const P = {
  tablero: '<rect x="3" y="4" width="5" height="16" rx="1"/><rect x="10" y="4" width="5" height="10" rx="1"/><rect x="17" y="4" width="4" height="13" rx="1"/>',
  caja: '<path d="M3 7.5 12 3l9 4.5v9L12 21l-9-4.5z"/><path d="M3 7.5 12 12l9-4.5M12 12v9"/>',
